<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lunar">
	<!-- CINNABAR SEAL WITH A CRESCENT MOON AS THE LUNAR BRAND MARK -->
	<rect width="64" height="64" rx="10" fill="#b23a2e" />
	<!-- CARVED INNER FRAME -->
	<rect x="7" y="7" width="50" height="50" rx="6" fill="none" stroke="#f7efe0" stroke-opacity="0.35" stroke-width="2" />
	<!-- CRESCENT MOON -->
	<circle cx="29" cy="32" r="18" fill="#f7efe0" />
	<circle cx="39" cy="24" r="17" fill="#b23a2e" />
</svg>
